name: build-exe

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 关键修复：WinAppSDK 单文件发布必须用 VS2022 的 MSBuild
      #（dotnet CLI 缺少 VS 的 PRI/AppxPackage 构建任务，会报 MSB4062）
      - name: 安装 VS2022 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 发布独立单文件 EXE
        shell: cmd
        run: |
          msbuild src\JellyWallpaper.App\JellyWallpaper.App.csproj /t:Restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true /p:WindowsAppSDKSelfContained=true /p:WindowsPackageType=None /p:EnableMsixTooling=true /p:PublishDir=dist\ /p:DebugType=embedded

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JellyWallpaper-win-x64
          path: dist
