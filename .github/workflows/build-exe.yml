name: build-exe

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 发布（官方流程，目录版免安装）
        shell: pwsh
        run: |
          dotnet publish src\JellyWallpaper.App\JellyWallpaper.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None -p:EnableMsixTooling=true -p:DebugType=embedded -o dist
          if (-not (Test-Path dist\JellyWallpaper.exe)) { Write-Error "[错误] 未生成 JellyWallpaper.exe"; exit 1 }
          Write-Host "[检查] dist 内容："
          Get-ChildItem dist | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: JellyWallpaper-win-x64
          path: dist
